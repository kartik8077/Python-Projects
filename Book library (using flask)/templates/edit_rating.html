{% extends 'base.html' %}

{% block title %}Change Rating{% endblock %}

{% block content %}
    <h1>Edit Book Rating</h1>
    <form action="{{ url_for('edit_rating') }}" method="POST">
        <p><strong>Book Name:</strong> {{ book.title }}</p>
        <p><strong>Current Rating:</strong> 🌟 {{ book.rating }}</p>

        <input name="id" type="hidden" value="{{ book.id }}">

        <label>New Rating</label>
        <input name="rating" type="number" step="0.1" placeholder="New Rating" min="0" max="10" required>

        <button type="submit">Change Rating</button>
    </form>
{% endblock %}
